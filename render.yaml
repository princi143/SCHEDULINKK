# Render blueprint: one web service + one PostgreSQL database.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
services:
  - type: web
    name: schedulink
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
      - key: APP_TZ
        value: Asia/Kolkata
      - key: DATABASE_URL
        fromDatabase:
          name: schedulink-db
          property: connectionString

databases:
  - name: schedulink-db
    plan: free
