<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedulink — Run your day</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo/schedulink-icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/professional.css') }}">
</head>
<body class="pro">

<aside class="side">
  <a class="brand" href="/"><img src="{{ url_for('static', filename='logo/schedulink-icon.svg') }}" alt=""><span>Schedulink</span></a>
  <div class="biz-chip"><div class="avatar" id="bizAvatar">S</div><div style="min-width:0"><b id="bizName">Your business</b><span id="bizCat">Professional</span></div></div>
  <nav id="nav" aria-label="Dashboard">
    <button class="on" data-view="today" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Today<i id="pendingDot" hidden></i></button>
    <button data-view="schedule" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Schedule</button>
    <button data-view="team" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.900 2.100 6.500 5.500M16 4.800a3.500 3.500 0 0 1 0 6.400M18.500 14.800c1.700.800 2.800 2.600 3 5.200"/></svg>Team &amp; services</button>
    <button data-view="insights" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Insights</button>
    <button data-view="profile" type="button"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.200 7-11.500a7 7 0 1 0-14 0C5 14.800 12 21 12 21z"/><circle cx="12" cy="9.500" r="2.500"/></svg>Business profile</button>
  </nav>
  <div class="side-foot">
    <button class="side-link" id="alertsBtn" type="button">Alerts <span class="dot-inline" id="alertDot" hidden>0</span></button>
    <a class="side-link" href="/customer" target="_blank" rel="noopener">See the customer side ↗</a>
    <button class="side-link" id="signOut" type="button">Sign out</button>
  </div>
</aside>

<main class="main">
  <section id="view-today"></section>
  <section id="view-schedule" hidden></section>
  <section id="view-team" hidden></section>
  <section id="view-insights" hidden></section>
  <section id="view-profile" hidden></section>
</main>

<div class="modal" id="formModal" role="dialog" aria-modal="true" aria-labelledby="fmTitle">
  <div class="box">
    <div style="display:flex;gap:10px;align-items:flex-start"><div><h2 id="fmTitle"></h2><p class="sub" id="fmSub"></p></div><button class="close-x" data-close aria-label="Close">×</button></div>
    <form id="fmForm" novalidate>
      <div id="fmFields"></div>
      <p class="form-error" id="fmError" role="alert"></p>
      <div style="display:flex;gap:10px"><button class="btn lg" style="flex:1" type="submit" id="fmSubmit">Save</button><button class="btn lg danger" type="button" id="fmExtra" hidden></button></div>
    </form>
  </div>
</div>

<script>window.SL_CATEGORIES = {{ categories|tojson }};</script>
<script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
<script src="{{ url_for('static', filename='js/professional.js') }}"></script>
</body>
</html>
